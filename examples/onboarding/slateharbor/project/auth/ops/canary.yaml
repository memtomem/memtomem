# Synthetic Slateharbor operational definitions; not deployed infrastructure.

legacy_callback:
  description: "legacy callback"
  policy_value: true
  environment: "production"
  observe: "구형 클라이언트 cohort의 callback 404를 확인하고 legacy route를 유지한다. V2 문제는 AUTH_CALLBACK_V2_ENABLED를 false로 되돌려 분리한다."
  failure: "INC-AUTH-17에서 신규 웹 로그인은 정상인데 구형 데스크톱만 callback 404가 발생했다. 웹 성공률 대시보드에는 장애가 드러나지 않았다."
  runbook: "auth/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

session_minutes:
  description: "session expiry"
  policy_value: 60
  environment: "production"
  observe: "idle 시간과 전체 세션 나이를 각각 확인하고 만료 시 재인증한다."
  failure: "교대 종료 후 같은 브라우저를 쓰던 다른 직원에게 이전 tenant 화면이 노출됐다."
  runbook: "auth/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

login_attempts:
  description: "login throttle"
  policy_value: 5
  environment: "production"
  observe: "계정과 시간창을 함께 확인하고 IP 전체 차단을 피한다."
  failure: "계정당 10회를 허용하는 동안 자동화 도구가 유효 계정 목록을 추려냈고, IP 단위로 막자 같은 사무실의 정상 로그인까지 함께 차단됐다."
  runbook: "auth/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

invite_hours:
  description: "invite validity"
  policy_value: 48
  environment: "production"
  observe: "초대 생성 시각과 회수 여부를 조회한 뒤 새 초대를 발급한다."
  failure: "회수된 초대 메일의 링크가 일주일 뒤에도 사용됐다."
  runbook: "auth/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

clock_skew_seconds:
  description: "clock skew"
  policy_value: 30
  environment: "production"
  observe: "서버 시간 편차를 측정하고 NTP 복구 후 인증 오류를 재확인한다."
  failure: "시간 동기화가 끊긴 worker가 만료된 세션을 허용했다."
  runbook: "auth/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

recovery_codes:
  description: "recovery inventory"
  policy_value: 8
  environment: "production"
  observe: "남은 코드 수 분포와 재발급 요청 건수를 함께 확인한다. 소진이 가까운 사용자에게 재발급을 먼저 안내한다."
  failure: "복구 코드 4개를 모두 소진한 사용자가 재발급 전까지 로그인하지 못해 지원팀 수동 처리로 몰렸다."
  runbook: "auth/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"
