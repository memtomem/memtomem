# Synthetic local policy profile; no service credentials.

[retry_attempts]
description = "notification retry policy"
value = 5
owner = "notifications-team"
revision = "2026-08-24"
reason = "알림 retry policy는 최대 5회, 250 ms backoff와 jitter다. 수신자에게 중복 메일을 보내지 않도록 delivery key를 유지한다."
implementation = "notifications/src/policy.py"

[backoff_ms]
description = "notification backoff"
value = 250
owner = "notifications-team"
revision = "2026-08-24"
reason = "재시도 최소 대기 250 ms 위에 jitter를 더해 worker들의 동시 재진입을 분산한다."
implementation = "notifications/src/policy.py"

[batch_size]
description = "digest batch"
value = 40
owner = "notifications-team"
revision = "2026-08-24"
reason = "digest 묶음을 줄여 특정 tenant의 대량 전송이 나머지 알림을 막지 않게 한다."
implementation = "notifications/src/policy.py"

[dedupe_hours]
description = "delivery deduplication"
value = 24
owner = "notifications-team"
revision = "2026-08-24"
reason = "하루 이내 같은 delivery key는 재전송 결과를 재사용한다. 새 사용자 행동은 새 key를 쓴다."
implementation = "notifications/src/policy.py"

[payload_kb]
description = "email payload"
value = 128
owner = "notifications-team"
revision = "2026-08-24"
reason = "큰 첨부물은 본문 대신 파일 링크로 전달한다. 파일 권한은 수신 시점에 다시 검사한다."
implementation = "notifications/src/policy.py"

[queue_age_minutes]
description = "notification queue age"
value = 15
owner = "notifications-team"
revision = "2026-08-24"
reason = "초대·멘션 알림의 지연은 큐 길이보다 가장 오래된 메시지 나이로 감지한다."
implementation = "notifications/src/policy.py"
