# Synthetic Slateharbor operational definitions; not deployed infrastructure.

freshness_minutes:
  description: "report freshness"
  policy_value: 15
  environment: "production"
  observe: "materialized_at과 원장 event watermark를 비교한다. 갱신 실패 시 이전 값과 지연 상태를 함께 보여준다."
  failure: "INC-REPORT-08에서 어제 생성된 캐시가 최신 매출처럼 표시돼 운영자가 정산을 다시 요청했다."
  runbook: "reports/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

export_rows:
  description: "CSV export rows"
  policy_value: 10000
  environment: "production"
  observe: "export 요청 ID로 기존 job을 조회하고 중복 클릭에는 같은 ID를 반환한다."
  failure: "동기 요청 timeout 뒤 사용자가 다시 눌러 같은 export가 여러 번 만들어졌다."
  runbook: "reports/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

window_days:
  description: "report window"
  policy_value: 90
  environment: "production"
  observe: "요청 기간을 확인하고 읽기 전용 분석 경로로 우회한다."
  failure: "1년 범위의 조인 쿼리가 운영 DB의 온라인 트래픽을 밀어냈다."
  runbook: "reports/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

cache_seconds:
  description: "report cache ttl"
  policy_value: 300
  environment: "production"
  observe: "cache key의 tenant와 permission revision을 확인하고 영향을 받은 key만 무효화한다."
  failure: "권한 변경 뒤에도 오래된 cache가 보였고 조직 구분이 빠진 key가 발견됐다."
  runbook: "reports/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

minimum_group:
  description: "aggregate group privacy"
  policy_value: 5
  environment: "production"
  observe: "그룹 크기를 확인하고 작은 그룹은 상위 집계로 합친다."
  failure: "한 명뿐인 팀의 통계가 개인 활동 내역처럼 표시됐다."
  runbook: "reports/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

query_seconds:
  description: "report query timeout"
  policy_value: 8
  environment: "production"
  observe: "query 상태와 오류 코드를 확인하고 마지막 정상 결과와 구분해서 표시한다."
  failure: "30초까지 실행되는 조회가 운영 DB 커넥션을 오래 점유해 같은 시각의 다른 리포트 요청까지 함께 느려졌다."
  runbook: "reports/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"
