# Synthetic local policy profile; no service credentials.

[freshness_minutes]
description = "report freshness"
value = 15
owner = "reports-team"
revision = "2026-08-24"
reason = "리포트는 최대 15분 지연을 허용하며 기준 시각을 화면에 표시한다. 결제 원장의 실시간 진실로 쓰지 않는다."
implementation = "reports/src/policy.py"

[export_rows]
description = "CSV export rows"
value = 10000
owner = "reports-team"
revision = "2026-08-24"
reason = "동기 CSV는 1만 행까지이고 큰 내보내기는 job ID를 반환한다."
implementation = "reports/src/policy.py"

[window_days]
description = "report window"
value = 90
owner = "reports-team"
revision = "2026-08-24"
reason = "대화형 조회는 90일 창으로 제한한다. 장기 감사 자료는 별도 batch export로 제공한다."
implementation = "reports/src/policy.py"

[cache_seconds]
description = "report cache ttl"
value = 300
owner = "reports-team"
revision = "2026-08-24"
reason = "동일 조건 리포트는 5분간 재사용한다. tenant와 권한 버전이 cache key에 포함된다."
implementation = "reports/src/policy.py"

[minimum_group]
description = "aggregate group privacy"
value = 5
owner = "reports-team"
revision = "2026-08-24"
reason = "이 데모의 집계는 5명 미만 그룹을 숨긴다. 개인정보 보호의 일반적인 충분조건으로 해석하지 않는다."
implementation = "reports/src/policy.py"

[query_seconds]
description = "report query timeout"
value = 8
owner = "reports-team"
revision = "2026-08-24"
reason = "느린 조회는 8초에 중단하고 비동기 분석을 안내한다. timeout을 빈 데이터로 표시하지 않는다."
implementation = "reports/src/policy.py"
