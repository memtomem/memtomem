# Synthetic Slateharbor operational definitions; not deployed infrastructure.

lease_seconds:
  description: "worker lease recovery"
  policy_value: 90
  environment: "production"
  observe: "checkpoint와 lease owner를 함께 읽는다. 완료면 결과를 재사용하고 만료·미완료일 때만 다시 claim한다."
  failure: "INC-JOBS-22에서 GC pause로 heartbeat가 늦자 살아 있는 worker의 작업을 다른 worker가 다시 수행했다."
  runbook: "jobs/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

max_parallel:
  description: "worker concurrency"
  policy_value: 4
  environment: "production"
  observe: "CPU와 heartbeat 지연을 함께 보고 동시 작업 수를 낮춘다."
  failure: "과도한 병렬 압축이 이벤트 루프를 막아 lease가 연달아 만료됐다."
  runbook: "jobs/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

checkpoint_seconds:
  description: "checkpoint interval"
  policy_value: 20
  environment: "production"
  observe: "출력 flush와 checkpoint 순서를 확인하고 마지막 durable offset부터 재개한다."
  failure: "메모리상의 진행률만 저장해 재시작 후 누락된 출력 구간이 생겼다."
  runbook: "jobs/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

retry_budget:
  description: "job retry budget"
  policy_value: 2
  environment: "production"
  observe: "입력 checksum과 실패 원인이 같은지 확인하고 재현 자료를 격리한다."
  failure: "손상된 파일 하나가 worker 시간을 반복 소비하며 정상 작업을 밀어냈다."
  runbook: "jobs/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

shutdown_seconds:
  description: "worker shutdown grace"
  policy_value: 45
  environment: "production"
  observe: "draining 상태와 마지막 checkpoint를 확인한 뒤 프로세스를 종료한다."
  failure: "즉시 종료 때문에 결과는 썼지만 완료 표시가 없어 작업이 다시 실행됐다."
  runbook: "jobs/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

backlog_limit:
  description: "job admission"
  policy_value: 200
  environment: "production"
  observe: "tenant별 입장 제한을 확인하고 예약 작업의 backpressure를 켠다."
  failure: "대량 업로드가 오래된 작업의 처리 약속을 깨뜨렸다."
  runbook: "jobs/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"
