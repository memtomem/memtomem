# Synthetic Slateharbor operational definitions; not deployed infrastructure.

webhook_attempts:
  description: "billing webhook retry"
  policy_value: 3
  environment: "production"
  observe: "provider event ID로 중복 수신을 확인하고 settlement 상태가 불명확하면 조회부터 한다."
  failure: "INC-BILL-09에서 공급자 timeout 뒤 재전송을 신규 청구로 처리해 중복 원장이 생겼다."
  runbook: "billing/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

invoice_days:
  description: "invoice grace period"
  policy_value: 14
  environment: "production"
  observe: "계약상 유예 일수와 invoice 발행일을 대조하고 읽기 접근은 유지한다."
  failure: "휴일에 청구서가 승인되지 않아 정상 조직이 읽기조차 못 했다."
  runbook: "billing/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

refund_days:
  description: "refund eligibility"
  policy_value: 30
  environment: "production"
  observe: "구매 시점과 정산 배치를 확인하고 수동 조정 번호를 남긴다."
  failure: "정산 종료 뒤 자동 환불이 실행돼 보고서 잔액과 공급자 잔액이 달라졌다."
  runbook: "billing/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

seat_floor:
  description: "minimum seats"
  policy_value: 3
  environment: "production"
  observe: "요금제 유형을 먼저 확인하고 견적과 실제 청구에 같은 좌석 기준을 사용한다."
  failure: "팀 요금제 계정이 좌석 1석까지 내려간 채 팀 기능을 계속 쓰면서 개인 요금제 기준 견적을 받았다."
  runbook: "billing/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

reconcile_minutes:
  description: "settlement lag"
  policy_value: 20
  environment: "production"
  observe: "공급자 event 시각과 수신 시각을 비교하고 지연 건은 다음 배치에서 재조회한다."
  failure: "짧은 경보 창으로 정상 지연 건마다 재정산 요청이 생성됐다."
  runbook: "billing/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"

currency_scale:
  description: "currency precision"
  policy_value: 2
  environment: "production"
  observe: "최소 통화 단위의 정수로 대조하고 입력 precision 초과를 거절한다."
  failure: "부동소수점 변환 후 공급자 요청과 로컬 원장 합계가 달라졌다."
  runbook: "billing/docs/runbooks/recovery.md"
  promotion: "Review observations before expanding beyond the pilot cohort"
