revision = "2026-08-24"
reason = "공급자의 지연 이벤트를 기다린 후 불일치 경보를 낸다. 결제 성공 여부를 임의로 바꾸지 않는다."
implementation = "billing/src/policy.py"

[currency_scale]
description = "currency precision"
value = 2
owner = "billing-team"
revision = "2026-08-24"
reason = "이 합성 USD 요금제는 소수 둘째 자리까지 받는다. 다른 통화로 일반화하지 않는다."
implementation = "billing/src/policy.py"
