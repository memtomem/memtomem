revision = "2026-08-24"
reason = "기업 고객의 월말 승인 주기를 반영하되 유예 기간 이후에는 쓰기 기능을 제한한다."
implementation = "billing/src/policy.py"

[refund_days]
description = "refund eligibility"
value = 30
owner = "billing-team"
revision = "2026-08-24"
reason = "사용량 정산이 닫힌 기간의 환불은 자동 경로 대신 수동 검토로 보낸다."
implementation = "billing/src/policy.py"

[seat_floor]
description = "minimum seats"
value = 3
owner = "billing-team"
revision = "2026-08-24"
reason = "팀 요금제 최소 좌석은 3석이다. 개인 무료 요금제에는 이 정책을 적용하지 않는다."
implementation = "billing/src/policy.py"

[reconcile_minutes]
description = "settlement lag"
value = 20
