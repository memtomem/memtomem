# Synthetic local policy profile; no service credentials.

[webhook_attempts]
description = "billing webhook retry"
value = 3
owner = "billing-team"
revision = "2026-08-24"
reason = "결제 webhook 재전송은 idempotency key로 중복 청구를 막는다. 알림 worker의 5회 재시도 정책을 복사하면 안 된다."
implementation = "billing/src/policy.py"

[invoice_days]
