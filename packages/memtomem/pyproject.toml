[project]
name = "memtomem"
version = "0.4.0"
description = "Markdown-first memory infrastructure for AI agents with hybrid search"
authors = [
    {name = "DAPADA Inc.", email = "contact@dapada.co.kr"},
    {name = "memtomem contributors"},
]
license = {text = "Apache-2.0"}
keywords = ["memory", "ai", "mcp", "agent", "rag", "embedding", "search", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Floor at 2.0: the server builds on ``mcp.server.mcpserver``, which is the
    # 2.0 replacement for the ``mcp.server.fastmcp`` package 2.0 removed. 1.x
    # does not ship that module, so the floor is hard — there is no dual-support
    # shim, per the SDK's own migration guide (#1978). Capped below 3.0 as
    # ordinary major-version hygiene: the server reaches into
    # ``_tool_manager`` for tool-mode pruning, so a major deserves a
    # deliberate look rather than a silent resolve.
    "mcp[cli]>=2.0.0,<3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlite-vec>=0.1.6",
    "httpx>=0.28",
    "watchdog>=6.0",
    "click>=8.1",
    "pathspec>=0.12",
    "croniter>=2.0",
    "portalocker>=3.0",
    # Windows shared locks. ``_instance_registry`` takes the startup side of
    # the lifecycle barrier with ``LOCK_SH`` on every OS — that is the whole
    # obligation. (``cli/_liveness`` also takes a shared lock, but all three
    # of its callers gate on ``os.name``/``sys.platform``, so Windows is
    # routed to the exclusive probe and never reaches it.)
    # Two separate upstream changes, often conflated: 3.2.0 made
    # ``MsvcrtLocker`` the default Windows locker (3.0/3.1 used
    # ``LockFileEx`` for both modes), and 4.0.0 moved ``pywin32`` from an
    # unconditional ``platform_system == "Windows"`` dependency behind a
    # ``win32`` extra. Only the second one costs us: msvcrt has no shared
    # lock, so ``MsvcrtLocker`` delegates ``LOCK_SH`` to ``Win32Locker`` and
    # raises ``ImportError`` when pywin32 is absent. ``ImportError``
    # is in neither ``_LOCK_CONTENDED`` nor ``_BARRIER_LOCK_ERRORS``, so it
    # would escape the barrier unhandled rather than degrade.
    #
    # Declared directly rather than as ``portalocker[win32]``: the floor is
    # still ``>=3.0`` and 3.x has no such extra, so the extra spelling would
    # silently resolve to nothing there. ``mcp`` pulls pywin32 transitively
    # today, which is why the gap is currently invisible — a transitive
    # dependency is not a contract.
    'pywin32>=226; sys_platform == "win32"',
    "cryptography>=48.0.1",
    "starlette>=1.3.1",
    "idna>=3.15",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0",
    # Reading an agent's index file means reading Markdown as Markdown: a
    # destination can be escaped, entity-encoded or angle-bracketed, and a link
    # can be quoted inside a code span. ``mm memory doctor --fix`` deletes lines
    # on the strength of that read, so it uses a CommonMark parser rather than a
    # pattern that has to enumerate every way the two differ. Already installed
    # in practice (mcp[cli] -> rich -> markdown-it-py); declared because we
    # import it directly.
    #
    # Capped, unlike the deps above, because we don't just call this one — we
    # override `normalizeLink`/`validateLink` on the instance (a documented
    # pattern, but internals). A major that reworks them would break at *user*
    # runtime, not in CI, which resolves through uv.lock. Raise the cap
    # deliberately: `TestDeceivingLines` is the contract to re-run against.
    "markdown-it-py>=3.0,<5",
]

[project.optional-dependencies]
onnx = ["fastembed>=0.8,<0.9", "urllib3>=2.7.0"]
ollama = ["ollama>=0.4"]
openai = ["openai>=1.60"]
korean = ["kiwipiepy>=0.18"]
code = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.49.0",
]
langfuse = ["langfuse>=4.0", "urllib3>=2.7.0"]
langgraph = ["langgraph>=1.0,<2"]
all = ["memtomem[onnx,ollama,openai,korean,code,web,langfuse,langgraph]"]

[project.scripts]
memtomem = "memtomem.cli:cli"
mm = "memtomem.cli:cli"
memtomem-server = "memtomem.server:main"
memtomem-web = "memtomem.web.app:main"

[project.urls]
Homepage = "https://github.com/memtomem/memtomem"
Repository = "https://github.com/memtomem/memtomem"
Issues = "https://github.com/memtomem/memtomem/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memtomem"]
