# Reviewed, time-boxed exceptions for the Python and JavaScript lockfile OSV gate.
#
# EMPTY BY DEFAULT. Prefer upgrading a dependency over adding an exception.
# OSV Scanner does not accept the reviewer-only `owner` key, so
# tools/check_osv_exceptions.py validates this canonical file and emits a
# scanner-native temporary config for CI.
#
# Schema (all keys required; ignoreUntil is a bare TOML date):
#
# [[exceptions]]
# id = "GHSA-xxxx-xxxx-xxxx"
# owner = "github-handle"
# reason = "No fixed release; affected path is not reachable"
# ignoreUntil = 2026-08-01

# toml 4.3.0 in packages/opencode-memtomem/package-lock.json (dev), published
# 2026-10-22. GHSA-h895-cgqg-jf52 named the package `tome` until OSV matched it to
# toml on 2026-10-26. Remove when @opencode-ai/plugin moves to an effect that allows
# toml>=5.0.1. Re-checked 2026-11-11: the plugin's dev builds through 2026-11-09 still pin
# effect 4.0.0-beta.83, and even effect 4.0.0-beta.103 requires toml ^4.1.2.

[[exceptions]]
id = "GHSA-4qx8-w7c3-pj3p"
owner = "memtomem"
reason = "toml (npm) flaw reached only by parsing untrusted TOML; dev-only, pulled by @opencode-ai/plugin through effect 4.0.0-beta.83, which requires toml ^4.1.1 (plugin 1.19.5, its latest, still pins it); the plugin ships no dependencies and its build parses no untrusted TOML"
ignoreUntil = 2026-12-20

