name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    # `edited` covers a retargeted base, which changes the commits under review.
    types: [opened, reopened, synchronize, edited]

# Each job grants only what its mode needs. Commenting on a pull request with
# GITHUB_TOKEN takes `pull-requests: write`; `issues: write` alone returns 403.
# Both jobs write the `CLA / PR #<n>` commit status, which is the CLA result.
permissions: {}

jobs:
  # Passes whether or not anyone is missing: the commit status carries the result,
  # and this check turns red only when that status could not be written.
  CLAAssistant:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check CLA signatures
        run: python3 .github/cla-check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNATURES_PATH: signatures/v1/cla.json
          SIGNATURES_BRANCH: cla-signatures
          CLA_DOCUMENT_URL: https://github.com/memtomem/memtomem/blob/main/CLA.md
          CLA_ALLOWLIST: dependabot[bot],memtomem
          CLA_SIGNATURE_TEXT: I have read the CLA Document and I hereby sign the CLA

  # Records a signature (or re-evaluates on `recheck`) and rewrites the status on
  # the pull request's current head commit. Its own run belongs to the default branch.
  CLASign:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record CLA signature
        run: python3 .github/cla-check.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNATURES_PATH: signatures/v1/cla.json
          SIGNATURES_BRANCH: cla-signatures
          CLA_DOCUMENT_URL: https://github.com/memtomem/memtomem/blob/main/CLA.md
          CLA_ALLOWLIST: dependabot[bot],memtomem
          CLA_SIGNATURE_TEXT: I have read the CLA Document and I hereby sign the CLA
