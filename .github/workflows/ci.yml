name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: "Regenerate the quality-gate baseline (cases.json + baseline_replay.json) and upload it as an artifact instead of running the check."
        type: boolean
        default: false
      refresh_retrieval_baselines:
        description: "Regenerate the retrieval-eval baselines (baseline_v0.3.8.json + baseline_v2.json) on Ubuntu and upload them as an artifact instead of running the floor checks."
        type: boolean
        default: false
  # schedule:
  #   - cron: "17 5 * * *"   # nightly — enable once LLM secrets are provisioned

# Single source of truth for the uv toolchain setup-uv installs. Pinning (vs
# "latest") keeps CI reproducible; Dependabot's github-actions updater can't
# touch a `with:` input, so bump this by hand — in lockstep with the same pin
# in release.yml.
env:
  UV_VERSION: "0.11.16"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      # Fail closed on pyproject <-> uv.lock drift (e.g. a Dependabot member-dep
      # update that edits the lock's requires-dist but not the member manifest).
      # dependabot.yml uses versioning-strategy: lockfile-only to prevent that at
      # the source; this is the CI backstop, since every other job resolves with
      # `uv sync --frozen` (which neither checks nor regenerates the lock).
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check packages/memtomem/src packages/memtomem/tests tools
      - run: uv run ruff format --check packages/memtomem/src packages/memtomem/tests tools

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: mypy (gradual)
        run: uv run mypy packages/memtomem/src
        continue-on-error: true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: >-
          uv run pytest
          --ignore=packages/memtomem/tests/test_golden_path.py
          -m "not ollama and not llm"
          --tb=short -q

  test-windows-shard:
    name: windows-test-shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: windows-latest
    # 35, matching the Linux/macOS `test` job. The 25-minute cap was set when
    # the worst shard ran ~12m; it has since crept to 24.4m on a green main
    # (28b6fee) and cancelled two PRs mid-run (#2058, #2266). Balancing the
    # shards by recorded cost buys back roughly 15% of the worst cell, which
    # is not enough on its own — a slow Windows runner still costs more than
    # the remaining margin. The timeout is a hang guard (#1642), and 35
    # minutes still catches a hang long before the 6-hour default does.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: >-
          uv run python tools/run_pytest_shard.py
          --shard-index ${{ matrix.shard }}
          --shard-count 2 --
          -m "not ollama and not llm"
          --tb=short -q

  test-windows:
    name: test (windows-latest)
    if: ${{ always() }}
    needs: [test-windows-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every Windows shard to succeed
        env:
          SHARD_RESULT: ${{ needs.test-windows-shard.result }}
        run: test "$SHARD_RESULT" = success

  test-browser:
    name: browser (Playwright + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      # ``--with-deps`` pulls the headless-shell apt packages on Ubuntu so
      # chromium can launch from a clean runner; the install also seeds the
      # browser cache that ``_playwright_browser_available()`` probes.
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest packages/memtomem/tests/web -m browser --tb=short -q

  test-golden-path:
    name: golden-path (ONNX bge-m3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Cache retrieval models (English bge-small + multilingual MiniLM)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: ${{ runner.os }}-fastembed-retrieval-v2-bge-small-en-multilingual-minilm
      # Same pin as the producer job below. `requires-python` is `>=3.12` and
      # no `.python-version` is committed, so without this the runner could
      # hand the *checks* a different interpreter — and a different SQLite —
      # than the one that measured the floors they check.
      - run: uv python pin 3.12
      - run: uv sync --frozen
      - run: uv run pytest packages/memtomem/tests/test_golden_path.py --tb=short -q
      - name: Audit public synthetic retrieval corpus
        run: uv run python tools/retrieval-eval/audit_public_corpus.py
      # A baseline edited without regenerating its manifest is exactly the
      # shape the manifest exists to rule out, so the hashes are checked here
      # rather than trusted.
      - name: Verify baseline provenance
        run: |
          uv run python tools/retrieval-eval/write_provenance.py \
            --output tools/retrieval-eval/PROVENANCE.json --check
      - name: Check public retrieval quality floors
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
        run: uv run python tools/retrieval-eval/check_baseline.py --runs 1
      - name: Check language-separated retrieval v2 floors
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
        run: uv run python tools/retrieval-eval/check_baseline_v2.py

  # Canonical producer for the retrieval-eval baselines, the same contract the
  # quality gate has had since #1837. These floors are *checked* on Ubuntu, so
  # they must be *produced* on Ubuntu: the platform delta is the size of the
  # margins they are built from (#2224 — a macOS recalibration RAISED
  # ko|genre_primary|mrr@10 to 0.31 while this runner observed 0.291).
  #
  # Its own job, not a step in golden-path: it runs ten calibration passes plus
  # the v2 RRF grid, which needs a far larger timeout than the floor checks
  # should ever be allowed. Being a separate job also means a failing floor
  # cannot block its own refresh — nothing here `needs:` golden-path.
  retrieval-baselines-refresh:
    name: retrieval baselines (canonical refresh)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_retrieval_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
      # Job-level, not per-step: these are properties of the measurement, and
      # the provenance step records them. Setting them only on the regenerate
      # step made the manifest report "unset" for a run that had them set.
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Cache retrieval models (English bge-small + multilingual MiniLM)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: ${{ runner.os }}-fastembed-retrieval-v2-bge-small-en-multilingual-minilm
      # Pin the interpreter for the same reason the quality gate does: a
      # refresh has to reproduce the assets it replaces.
      - run: uv python pin 3.12
      - run: uv sync --frozen
      - name: Regenerate both baselines
        run: |
          uv run python tools/retrieval-eval/calibrate_portfolio.py \
            --runs 10 --factor 0.85 --output tools/retrieval-eval/baseline_v0.3.8.json
          uv run python tools/retrieval-eval/tune_rrf_v2.py \
            --output tools/retrieval-eval/baseline_v2.json
      # A lowered floor is a claim; this is what lets someone audit it later.
      - name: Record provenance
        env:
          MEMTOMEM_PROVENANCE_COMMIT: ${{ github.sha }}
          MEMTOMEM_PROVENANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python tools/retrieval-eval/write_provenance.py \
            --output tools/retrieval-eval/PROVENANCE.json
      - name: Upload regenerated retrieval baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-eval-baselines
          path: |
            tools/retrieval-eval/baseline_v0.3.8.json
            tools/retrieval-eval/baseline_v2.json
            tools/retrieval-eval/PROVENANCE.json

  quality-gate:
    name: quality-gate (BM25 replay)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      # Ubuntu is the canonical baseline producer; pin the interpreter so a
      # workflow_dispatch refresh reproduces the committed assets (see
      # tools/quality-gate/README.md). The check step also benefits from it.
      - run: uv python pin 3.12
      - run: uv sync --frozen
      # Required: a policy violation fails the PR. The advisory introduction
      # window (#1837) closed with no mac↔Ubuntu ranking drift across PR-B, the
      # Ubuntu baseline regen, and unrelated PRs, so the gate now blocks.
      # Thresholds live in policy.json, never here; refresh the baseline in the
      # same PR as any intended ranking change (see tools/quality-gate/README.md).
      - name: Replay quality gate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.refresh_baseline) }}
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
        run: uv run python tools/quality-gate/run_gate.py
      # Canonical refresh: regenerate the assets on Ubuntu and upload them for a
      # maintainer to review + commit. Records the Python + SQLite versions.
      - name: Refresh canonical baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_baseline }}
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
        run: |
          uv run python tools/quality-gate/run_gate.py --refresh-baseline
          uv run python -c "import sqlite3, sys; open('tools/quality-gate/versions.txt', 'w').write(f'python={sys.version.split()[0]}\nsqlite={sqlite3.sqlite_version}\n')"
      - name: Upload regenerated baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_baseline }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-baseline
          path: |
            tools/quality-gate/cases.json
            tools/quality-gate/baseline_replay.json
            tools/quality-gate/versions.txt

  test-llm-nightly:
    name: llm-nightly (optional)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run pytest -m "llm" --tb=short -q

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run pytest packages/memtomem/tests/test_notebooks.py --tb=short -q

  test-js:
    name: js-unit (vitest + jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/memtomem/tests-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 20 is below the floor the jsdom 30 line requires
      # (`^22.22.2 || ^24.15.0 || >=26.0.0`, and its undici dependency needs
      # >=22.19.0) — `npm ci` only warns EBADENGINE there and the whole suite
      # then dies at import time. The range, rather than a bare "24", is
      # load-bearing: with check-latest off setup-node takes the newest
      # matching version already in the runner tool cache, which can be a 24.x
      # below jsdom's 24.15.0 floor.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "^24.15.0"
          cache: npm
          cache-dependency-path: packages/memtomem/tests-js/package-lock.json
      - run: npm ci
      - run: npm test

  test-opencode-plugin:
    name: OpenCode plugin (build + unit + pack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/opencode-memtomem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/opencode-memtomem/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run pack:check

  packaging-smoke:
    # Mirrors the wheel-install half of the release preflight so a dependency
    # bump that breaks an extra's install or import fails here, on the PR,
    # instead of at tag time when the release is already in flight (#2071).
    name: packaging-smoke (wheel + all extras)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - name: Every distribution an extra installs has a probe
        # --with packaging: only the coverage check parses PEP 508, and it
        # only ever runs here, from the checkout. packaging is a workspace
        # dev dependency, NOT a memtomem runtime one, so the probe run in
        # the isolated [all] venv below must not need it — see the lazy
        # import in the helper.
        run: uv run --no-project --python 3.12 --with packaging python
          tools/extras_import_smoke.py --check-coverage --repo-root .
      - name: Build wheel
        run: uv build packages/memtomem --out-dir ci-dist
      - name: Base install imports and runs
        run: |
          set -euo pipefail
          wheel=$(find ci-dist -maxdepth 1 -name '*.whl' -print -quit)
          uv venv --python 3.12 "$RUNNER_TEMP/ci-base"
          uv pip install --python "$RUNNER_TEMP/ci-base/bin/python" "$wheel"
          uv pip check --python "$RUNNER_TEMP/ci-base/bin/python"
          "$RUNNER_TEMP/ci-base/bin/mm" --version
      - name: All-extras install imports
        run: |
          set -euo pipefail
          wheel=$(find ci-dist -maxdepth 1 -name '*.whl' -print -quit)
          uv venv --python 3.12 "$RUNNER_TEMP/ci-all"
          uv pip install --python "$RUNNER_TEMP/ci-all/bin/python" "${wheel}[all]"
          uv pip check --python "$RUNNER_TEMP/ci-all/bin/python"
          "$RUNNER_TEMP/ci-all/bin/python" tools/extras_import_smoke.py

  vendored-assets:
    name: vendored-assets (OSV blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      # The Web UI ships SHA-pinned browser libs (DOMPurify, marked, Prism,
      # Swagger UI) that live in no package.json, so `npm audit` never sees
      # them. This queries OSV for every npm package/version in
      # web/static/vendor/THIRD_PARTY_LICENSES.md and fails on any advisory.
      # (The SHA<->disk pin check runs offline in the `test` job.)
      - run: uv run python tools/check_vendored_advisories.py

  python-deps:
    name: python-deps (OSV blocking — Python + JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Both shipped Python resolution metadata and the JavaScript lockfiles are
    # blocking. A reviewed exception must use the canonical owner/reason/
    # expiry schema; CI converts it to OSV Scanner's stricter native schema.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      # Hand-maintained pin: Dependabot sees no release-asset URL, so on a bump
      # update OSV_VERSION and the matching osv-scanner_linux_amd64 SHA-256 from
      # the release's osv-scanner_SHA256SUMS together.
      - name: Install osv-scanner (pinned + SHA-256 verified)
        env:
          OSV_VERSION: v2.3.8
          OSV_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Validate reviewed OSV exceptions
        run: >-
          uv run --no-project --python 3.12 python tools/check_osv_exceptions.py
          --output "$RUNNER_TEMP/osv-scanner.toml"
      # osv-scanner queries OSV.dev live, so the pinned binary never goes stale
      # on advisory data. Scan both lockfiles in one invocation so an exception
      # cannot accidentally make only one ecosystem blocking.
      - name: OSV scan (Python + JavaScript lockfiles — blocking)
        run: |
          set -o pipefail
          rc=0
          ./osv-scanner scan source \
            --config="$RUNNER_TEMP/osv-scanner.toml" \
            --lockfile=uv.lock \
            --lockfile=packages/memtomem/tests-js/package-lock.json \
            --lockfile=packages/opencode-memtomem/package-lock.json \
            --format markdown --verbosity error | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          # rc 0 = clean, 1 = advisories found. Higher
          # means the scan itself errored (e.g. OSV.dev unreachable), so the
          # short/empty summary must NOT be read as "clean".
          if [ "$rc" -gt 1 ]; then
            echo "> :warning: osv-scanner exited ${rc} — the advisory scan may not have completed." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

  bandit:
    name: bandit (security lint — blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      # Bandit compares against a committed baseline and blocks only *new*
      # findings. Scoped to shipped source (src/). Regenerate the
      # baseline after an intentional change with:
      #   uvx bandit@1.9.4 -r packages/memtomem/src -f json -o tools/bandit-baseline.json
      # (A no-op regen only rewrites the generated_at timestamp — that diff is benign.)
      - name: bandit (new findings vs baseline — blocking)
        run: >-
          uvx bandit@1.9.4 -r packages/memtomem/src
          -b tools/bandit-baseline.json -q

  security-gates:
    name: security-gates
    if: ${{ always() }}
    needs: [test-js, test-opencode-plugin, vendored-assets, python-deps, bandit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Require every security dependency to succeed
        env:
          JS_RESULT: ${{ needs.test-js.result }}
          OPENCODE_RESULT: ${{ needs.test-opencode-plugin.result }}
          VENDORED_RESULT: ${{ needs.vendored-assets.result }}
          OSV_RESULT: ${{ needs.python-deps.result }}
          BANDIT_RESULT: ${{ needs.bandit.result }}
        run: |
          set -euo pipefail
          for result in "$JS_RESULT" "$OPENCODE_RESULT" "$VENDORED_RESULT" "$OSV_RESULT" "$BANDIT_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "security dependency did not succeed: $result" >&2
              exit 1
            fi
          done
