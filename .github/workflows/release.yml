name: Publish

# Publishes the memtomem distribution to PyPI (or TestPyPI for dry-runs)
# via PyPI Trusted Publishers (OIDC). No API tokens are stored.
#
# Tag conventions:
#   v0.1.0          → PyPI                (production)
#   test-v0.1.0a1   → TestPyPI            (dry run)
#
# Both paths share the same `pypi` GitHub environment, gated to tag
# pushes matching `v*` and `test-v*` only.
#
# ---------------------------------------------------------------------------
# Release order, and the four things that bite
# ---------------------------------------------------------------------------
#
#   1. changelog PR (entries only)  →  2. version bump PR  →  3. merge
#
#   Step 2 is "version-only" in the sense that it changes no behaviour — but it
#   is NOT just pyproject. It also moves uv.lock, the `## [X.Y.Z]` changelog
#   heading, BOTH server.json version fields, contract.toml's core version and
#   all five plugin delivery versions, hook_dispatch.py's CORE_VERSION, the
#   documentation and example pins, and the static cache manifest — then
#   re-renders with tools/render_plugin_assets.py.
#   test_core_version_is_single_sourced_across_automation_assets pins
#   contract.toml's core to pyproject's, so a package-only bump fails CI.
#   4. wait for the main-push CI run on the squash commit to go green
#   5. test-v<X>a1  →  TestPyPI  →  install-and-handshake smoke
#   6. v<X>         →  PyPI      →  confirm on two surfaces
#   7. opencode-v<Y>  →  npm     →  only after 6 is confirmed
#   8. mcp-registry job (automatic after PyPI publish; independent of step 7)
#
# (a) The dry-run is ONE SHOT PER VERSION. `_TEST_TAG_RE` in
#     tools/release_preflight.py drops the attempt suffix, so `test-v1.2.3a1`
#     uploads **1.2.3** to TestPyPI, not 1.2.3a1 — and `skip-existing: true`
#     below makes a later `a2` a silent no-op. Check TestPyPI for that version
#     before pushing the tag; if it is already there, the retry uploads nothing.
#
# (b) Step 4 is not optional politeness. The preflight's `wait-ci` step requires
#     the exact main-push run for $GITHUB_SHA to have succeeded, so tagging
#     early just burns up to 2400s of waiting.
#
# (c) Step 7 checks the exact core pin against the version-specific PyPI JSON
#     API in preflight (#2510). If that version is absent, approve / wait for
#     the PyPI release and confirm propagation before rerunning OpenCode.
#     Keep the separate tags: npm does not wait for PyPI environment approval.
#
# (d) A green publish job is not an upload (`skip-existing` can mask one), and
#     an upload is not yet availability — npm says so outright ("may take a few
#     minutes to become available"). Read surfaces can also disagree with each
#     other for a while. So: confirm by *retrieval*, on two surfaces (JSON API
#     and simple index, or packument and version document), and re-probe before
#     concluding anything is missing. The publish step's log establishes that
#     the upload happened, never that the artifact is fetchable. Keep "could not
#     confirm" separate from "failed".
#
# Step 8 uses GitHub OIDC, with no stored token (#2509). Its read-only gate
# polls the version-specific PyPI description for the ownership token for up
# to 300s, then requires the registry version to be unused (including deleted
# records). A completed release rerun FAILS this gate instead of publishing
# twice. Fix a missing ownership marker with a new PyPI release; immutable
# metadata cannot be repaired by rerunning this workflow. Retry only after
# checking which prerequisite failed. TestPyPI never publishes to the registry.
#
# The OIDC publish job builds and publishes in one job — no distribution
# artifact crosses jobs or run-attempts. A read-only preflight independently
# verifies the exact main CI run, package contract, and isolated installs;
# the production-only SBOM job independently describes the immutable tag.
#
# `uv build` is given an explicit source path AND --out-dir so the
# resulting dist/ lands at the workspace root regardless of monorepo
# layout (uv otherwise picks the workspace root, not the cwd, when
# building a workspace member).

on:
  push:
    tags:
      - "v[0-9]*"        # production
      - "test-v[0-9]*"   # TestPyPI dry-run

# Pin the uv toolchain for reproducible release builds. Keep in lockstep with
# the same pin in ci.yml (Dependabot can't bump a `with:` input).
env:
  UV_VERSION: "0.11.16"

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Validate tag, package, lock, changelog, and registry-record versions
        id: contract
        run: >-
          uv run --no-project --python 3.12 python tools/release_preflight.py contract
          --tag "$GITHUB_REF_NAME"
          --repo-root .
          --require-registry-manifest
          --github-output "$GITHUB_OUTPUT"
      - name: Require the tag commit to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require the exact main-push CI run to succeed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.12 python tools/release_preflight.py wait-ci
          --repository "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA"
          --timeout-seconds 2400
          --interval-seconds 15
      - run: uv lock --check
      - name: Build preflight distributions
        run: uv build packages/memtomem --out-dir preflight-dist
      - name: Validate wheel and sdist metadata
        run: >-
          uv run --no-project --python 3.12 python tools/release_preflight.py artifacts
          --dist preflight-dist
          --version "${{ steps.contract.outputs.version }}"
          --repo-root .
      - name: Verify isolated base, all-extras, and sdist installs
        run: |
          set -euo pipefail
          wheel=$(find preflight-dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find preflight-dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          uv venv --python 3.12 "$RUNNER_TEMP/release-base"
          uv pip install --python "$RUNNER_TEMP/release-base/bin/python" "$wheel"
          uv pip check --python "$RUNNER_TEMP/release-base/bin/python"
          "$RUNNER_TEMP/release-base/bin/mm" --version
          uv venv --python 3.12 "$RUNNER_TEMP/release-all"
          uv pip install --python "$RUNNER_TEMP/release-all/bin/python" "${wheel}[all]"
          uv pip check --python "$RUNNER_TEMP/release-all/bin/python"
          "$RUNNER_TEMP/release-all/bin/python" tools/extras_import_smoke.py
          uv venv --python 3.12 "$RUNNER_TEMP/release-sdist"
          uv pip install --python "$RUNNER_TEMP/release-sdist/bin/python" "$sdist"
          uv pip check --python "$RUNNER_TEMP/release-sdist/bin/python"

  publish:
    name: Build and publish to ${{ startsWith(github.ref_name, 'test-') && 'TestPyPI' || 'PyPI' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: ${{ startsWith(github.ref_name, 'test-') && 'https://test.pypi.org/p/memtomem' || 'https://pypi.org/p/memtomem' }}
    permissions:
      id-token: write   # required for OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build distribution
        run: uv build packages/memtomem --out-dir dist
      - name: Revalidate publish artifacts
        run: |
          set -euo pipefail
          version=$(uv run --no-project --python 3.12 python tools/release_preflight.py \
            contract --tag "$GITHUB_REF_NAME" --repo-root .)
          uv run --no-project --python 3.12 python tools/release_preflight.py \
            artifacts --dist dist --version "$version" --repo-root .
      - name: Publish to PyPI
        if: ${{ !startsWith(github.ref_name, 'test-') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
      - name: Publish to TestPyPI
        if: ${{ startsWith(github.ref_name, 'test-') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  mcp-registry:
    name: Publish to the MCP Registry
    needs: publish
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mcp-registry-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Verify released ownership and refuse an already-listed version
        id: registry-gate
        run: >-
          uv run --no-project --python 3.12 python tools/release_preflight.py registry
          --tag "$GITHUB_REF_NAME" --repo-root .
          --timeout-seconds 300 --interval-seconds 10
      - name: Install checksum-pinned mcp-publisher
        id: publisher-install
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" mcp-publisher
      - name: Authenticate with GitHub OIDC
        id: registry-login
        run: ./mcp-publisher login github-oidc
      - name: Publish the checked-in server record
        id: registry-publish
        run: ./mcp-publisher publish

  sbom:
    name: Publish production SBOMs
    needs: publish
    if: ${{ !startsWith(github.ref_name, 'test-') }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-sbom.yml
    with:
      release_tag: ${{ github.ref_name }}
