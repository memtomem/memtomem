name: CPU ONNX smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    # Keeps the job names `smoke (<os>)`; without it the `python` key joins them.
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Same per-OS pins as the `test` job in ci.yml. Unpinned, uv uses the
        # newest interpreter on the image, and macos-26-arm64 ships Homebrew
        # CPython 3.15, for which onnxruntime 1.24.4 has no wheel.
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.16'
      - run: uv python pin ${{ matrix.python }}
      - run: uv sync --frozen
      # ``runner`` is not an available context in job-level ``env`` (only
      # github/inputs/matrix/needs/secrets/strategy/vars are), so declaring the
      # cache path up there made the whole file invalid: GitHub produced a
      # zero-job startup failure on every push instead of a dispatch-only
      # workflow. Step-level ``env`` is where ``runner`` becomes available.
      - run: uv run python tools/cpu-embedding/smoke.py
        env:
          MEMTOMEM_FASTEMBED_CACHE: ${{ runner.temp }}/e5-models
