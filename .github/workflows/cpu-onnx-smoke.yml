name: CPU ONNX smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
      - run: uv sync --frozen
      # ``runner`` is not an available context in job-level ``env`` (only
      # github/inputs/matrix/needs/secrets/strategy/vars are), so declaring the
      # cache path up there made the whole file invalid: GitHub produced a
      # zero-job startup failure on every push instead of a dispatch-only
      # workflow. Step-level ``env`` is where ``runner`` becomes available.
      - run: uv run python tools/cpu-embedding/smoke.py
        env:
          MEMTOMEM_FASTEMBED_CACHE: ${{ runner.temp }}/e5-models
